packages:
  - apps/*
  - packages/*

# pnpm 10 blocks dependency install scripts by default. Only packages that
# genuinely need them are allowed here (verified from `pnpm install` output).
onlyBuiltDependencies:
  - '@prisma/engines'
  - esbuild
  - prisma

# unrs-resolver (via eslint-config-next) ships prebuilt binaries as optional
# dependencies; its postinstall is not needed, so it stays blocked.
ignoredBuiltDependencies:
  - unrs-resolver
