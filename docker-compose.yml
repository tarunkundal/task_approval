# Local development MySQL only. Not used in production.
# Reads MYSQL_ROOT_PASSWORD / MYSQL_USER / MYSQL_PASSWORD from ./.env (see .env.example).
services:
  mysql:
    image: mysql:8.4
    container_name: task-approval-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in ./.env}
      MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in ./.env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in ./.env}
      MYSQL_DATABASE: task_approval
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - '3307:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  mysql-data:
